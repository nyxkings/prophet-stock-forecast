[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    integration: End-to-end integration tests
    edge_cases: Edge case and error handling tests
    unit: Unit tests
    slow: Tests that take a long time to run
    mock: Tests that use mocking extensively

# Coverage options
addopts = 
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --strict-markers
    -v

# Log settings
log_cli = false
log_cli_level = INFO
log_file = tests.log
log_file_level = DEBUG

# Timeout for individual tests (seconds)
timeout = 300

# Minimum Python version
minversion = 7.0
