version: 2.1
orbs:
  python: circleci/python@2.0.0

jobs:
  setup:
    executor:
      name: python/default
      tag: "3.12"
    steps:
      - checkout
      - run:
          name: Configure Poetry in-project virtualenv
          command: poetry config virtualenvs.in-project true
      - python/install-packages:
          pkg-manager: poetry
          args: --with dev
          no_output_timeout: 20m
          # Disable orb cache: parallel jobs race on /tmp/cci_pycache/lockfile
          venv-cache: false
          pypi-cache: false
      - persist_to_workspace:
          root: .
          paths:
            - .

  lint:
    executor:
      name: python/default
      tag: "3.12"
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Run ruff linting
          command: poetry run ruff check src tests
      - run:
          name: Check code formatting with black
          command: poetry run black --check src tests

  type-check:
    executor:
      name: python/default
      tag: "3.12"
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Run mypy type checking
          command: poetry run mypy src

  test:
    executor:
      name: python/default
      tag: "3.12"
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Run tests with coverage
          command: poetry run pytest --cov-report=xml
      - store_artifacts:
          path: coverage.xml
          destination: coverage

workflows:
  version: 2
  ci:
    jobs:
      - setup
      - lint:
          requires:
            - setup
      - type-check:
          requires:
            - setup
      - test:
          requires:
            - setup
